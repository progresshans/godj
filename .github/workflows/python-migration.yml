name: Collect Python migration candidates
on:
  pull_request:
    paths:
      - '.github/workflows/python-migration.yml'
permissions:
  contents: read
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      LC_ALL: C
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      GODJ_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Observe independent reference candidates
        run: |
          uv python install 3.14.10
          uv run --no-project --python 3.14.10 python scripts/ci/observe_python_migration.py "$RUNNER_TEMP/python-migration"
      - name: Publish reference candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-migration-${{ matrix.host }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-migration
          if-no-files-found: error
          retention-days: 30
