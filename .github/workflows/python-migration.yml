name: Audit Python classification on macOS 26
on:
  pull_request:
    paths:
      - '.github/workflows/python-migration.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      LC_ALL: C
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONWARNINGS: error::ResourceWarning
      GODJ_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Audit every discovered case under the native reference
        env:
          GODJ_PYTHON_INVENTORY: ${{ runner.temp }}/python-classification/inventory.json
        run: |
          test "$(uv --version | cut -d' ' -f2)" = 0.13.6
          uv python install 3.14.10
          UV_PYTHON="$(uv python find --managed-python 3.14.10)"
          export UV_PYTHON
          uv sync --frozen
          uv sync --project conformance/reference/drf --frozen
          uv run --frozen --project conformance/reference/drf python -m scripts.ci.python_tests --profile exact-all
          PYTHONPATH=scripts/ci python3 - <<'PY'
          import json, os
          from pathlib import Path
          from project_reference import seal, source_identity
          p = Path(os.environ['GODJ_PYTHON_INVENTORY'])
          inventory = json.loads(p.read_bytes())
          assert inventory['profile'] == 'exact-all' and not inventory['skipped']
          assert sorted(inventory['started']) == sorted(inventory['stopped']) == inventory['discovered']
          (p.parent / 'source.json').write_text(json.dumps(source_identity(), sort_keys=True) + '\n')
          seal(p.parent)
          PY
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
      - name: Publish complete native classification audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-classification-macos-26-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-classification
          if-no-files-found: error
          retention-days: 90
