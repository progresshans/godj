name: Measure repeated Go preparation
on:
  pull_request:
    paths:
      - '.github/workflows/ci-preparation-measurement.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: false
      - name: Measure isolated processes and verify the same output and event inventories
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          go version
          python3 - <<'PY'
          import os,sys,subprocess,time,json,tempfile,re,pathlib,statistics
          b=pathlib.Path.cwd();d=pathlib.Path(os.environ['RUNNER_TEMP'])
          pkg='github.com/progresshans/godj/conformance/runserverproduct'
          make=(b/'Makefile').read_text()
          projects=re.findall(r'go run ./cmd/godj generate --check --project (\S+)',make)
          assert len(projects)==11
          sel='^TestRunserverPublicOnlyEnvironmentsDiscardAmbientArticleCredentials$'
          def run(cmd,cwd=b):
           t=time.monotonic()
           r=subprocess.run(cmd,cwd=cwd,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
           if r.returncode:raise RuntimeError((cmd,r.stderr[-2000:],r.stdout[-1000:]))
           return time.monotonic()-t,r.stdout
          def one(kind,opt):
           with tempfile.TemporaryDirectory() as t:
            binary=pathlib.Path(t)/'program'
            times=[]
            if kind=='generate':
             cmd=['go','run','./cmd/godj']
             if opt:
              times.append(run(['go','build','-o',str(binary),'./cmd/godj'])[0]);cmd=[str(binary)]
             outputs=[]
             for p in projects:
              duration,out=run(cmd+['generate','--check','--project',p]);times.append(duration);outputs.append(out)
             result=b''.join(outputs)
            else:
             tests=[['-list','.'],['-run',sel],['-run',sel]]
             if opt:times.append(run(['go','test','-c','-o',str(binary),pkg])[0])
             result=[]
             for args in tests:
              if opt:
               cmd=['go','tool','test2json','-t','-p',pkg,str(binary),'-test.v=test2json','-test.count=1','-test.timeout=15m','-test.'+args[0][1:]+'='+args[1]]
               duration,out=run(cmd,b/'conformance/runserverproduct')
              else:
               duration,out=run(['go','test','-count=1','-timeout=15m','-json',*args,pkg])
              times.append(duration)
              events=[json.loads(v) for v in out.splitlines()];assert events[0]['Action']=='start' and events[-1]['Action']=='pass' and all(e['Package']==pkg for e in events)
              if args[0]=='-list':
               listed=sorted(e.get('Output','').strip() for e in events if re.fullmatch(r'(Test|Fuzz|Example)[A-Za-z0-9_]+',e.get('Output','').strip()))
               assert len(listed)>10
               result.append(listed)
              else:
               result.append([e['Test'] for e in events if e['Action']=='pass' and 'Test'in e]);assert len(result[-1])==1
            return {'cost':round(sum(times),3),'steps':[round(x,3) for x in times]},result
          for kind in ['generate','server']:
           # prime the build cache equally, then alternate order
           a,reference=one(kind,False);a,control=one(kind,True);assert reference==control
           rows=[]
           for opt in [False,True,True,False,False,True]:
            t,r=one(kind,opt);assert r==reference;rows.append({'prepared':opt,**t})
           print(kind,rows,flush=True)
           (d/('bench-'+kind+'.json')).write_text(json.dumps(rows))
          PY
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
