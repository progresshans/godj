name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      suite:
        description: Explicit validation scope; only full proves all platforms
        type: choice
        default: full
        options: [full, orm, cli, web, reference]


concurrency:
  # Unrelated PR labels must not cancel a running or pending validation.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && !contains(fromJSON('["ci:full", "ci:orm", "ci:cli", "ci:web", "ci:reference"]'), github.event.label.name) && github.run_id || 'validation' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validation-plan:
    if: github.event_name != 'pull_request' || contains(fromJSON('["ci:full", "ci:orm", "ci:cli", "ci:web", "ci:reference"]'), github.event.label.name)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          VALIDATION_SUITE: ${{ inputs.suite || github.event.label.name || 'full' }}
        run: python3 scripts/ci/scopes.py plan

  conformance-validation:
    needs: [validation-plan, postgresql-product]
    if: needs.validation-plan.result == 'success' && contains(fromJSON(needs.validation-plan.outputs.jobs || '[]'), 'conformance-validation')
    name: Validate references and current product captures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LC_ALL: C
      PYTHONHASHSEED: "0"
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.14.3"
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --frozen

      - name: Print non-authoritative CI fingerprint
        run: |
          uv run --frozen python -c 'import django, platform, sqlite3, sys; print(sys.version); print(django.get_version()); print(sqlite3.sqlite_version); print(platform.platform())'
          go version

      - name: Download current system-state capture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: systemstate-postgres-${{ github.run_attempt }}
          path: ${{ runner.temp }}/godj-evidence/systemstate

      - name: Download current operator capture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: operator-postgres-${{ github.run_attempt }}
          path: ${{ runner.temp }}/godj-evidence/operator

      - name: Verify same-run capture provenance and execute conformance
        env:
          ATTESTATION_DIR: ${{ runner.temp }}/godj-evidence
        run: |
          python3 scripts/ci/capture_artifact.py verify "$ATTESTATION_DIR/systemstate" postgresql-17.10-two-process-v1.json
          python3 scripts/ci/capture_artifact.py verify "$ATTESTATION_DIR/operator" postgresql-17.10-sqlite-external-operator-v1.json
          make docs-check format-check generate-check python-test conformance-check godj-conformance

      - name: Compile migration definition and project-check products on 32-bit Linux
        env:
          CGO_ENABLED: "0"
          GOARCH: "386"
        run: >
          go test -run '^$' -count=1
          ./migrations/definition
          ./cmd/godj
          ./project
          ./internal/projectcheck/...
          ./conformance/runners/godj
          ./conformance/projectmigratetargetproduct
          ./conformance/projectshowmigrationsproduct
          ./conformance/projectsqlmigrateproduct
          ./conformance/projectoperatorproduct

      - name: Compile runserver product on 32-bit Linux
        env:
          CGO_ENABLED: "0"
          GOARCH: "386"
        run: go test -run '^$' -count=1 -exec=/usr/bin/true ./conformance/runserverproduct

      - name: Run relation products on 32-bit Linux
        env:
          CGO_ENABLED: "0"
          GOARCH: "386"
        run: >
          go test -count=1
          ./query
          ./orm
          ./conformance/relationfixture/...
          ./conformance/relationproduct/...
          ./conformance/relationqueryproduct/...
          ./conformance/relationobjectproduct/...
          ./conformance/relationreverseproduct/...
          ./conformance/relationprefetchproduct/...
          ./conformance/relationselectproduct/...
          ./conformance/relationdeleteproduct/...
          ./conformance/migrationrelationproduct
          ./conformance/runners/godj

      - name: Verify stored oracle checksum
        working-directory: conformance/oracles/django-6.1-sqlite-darwin-arm64
        run: sha256sum --check SHA256SUMS

      - name: Verify stored DRF oracle checksum
        working-directory: conformance/oracles/drf-3.18.0-django-6.1-sqlite-darwin-arm64
        run: sha256sum --check SHA256SUMS

      - name: Ensure reference artifacts were not rewritten
        run: >
          git diff --exit-code --
          conformance/contracts
          conformance/fixtures/godj-query-breadth-not-implemented.json
          conformance/fixtures/godj-query-expression-not-implemented.json
          conformance/fixtures/godj-migration-command-not-implemented.json
          conformance/fixtures/godj-migration-writer-not-implemented.json
          conformance/fixtures/godj-migration-status-not-implemented.json
          conformance/fixtures/godj-migration-target-plan-not-implemented.json
          conformance/fixtures/godj-migration-sql-rendering-not-implemented.json
          conformance/fixtures/godj-migration-target-plan-deviation-expected.json
          conformance/fixtures/godj-migration-writer-deviation-expected.json
          conformance/fixtures/godj-parameter-routing-not-implemented.json
          conformance/fixtures/godj-article-api-not-implemented.json
          conformance/fixtures/godj-api-authentication-not-implemented.json
          conformance/fixtures/godj-api-authentication-deviation-expected.json
          conformance/fixtures/godj-system-state-not-implemented.json
          conformance/fixtures/godj-system-state-deviation-expected.json
          conformance/profiles
          conformance/oracles
          conformance/reference/drf

  portable-go-matrix:
    needs: validation-plan
    if: needs.validation-plan.result == 'success' && contains(fromJSON(needs.validation-plan.outputs.jobs || '[]'), 'portable-go-matrix')
    name: Portable Go (${{ matrix.mode }}, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      LC_ALL: C
      TZ: UTC
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: normal
            shard: core-vet
            make_targets: "go-test-core go-vet"
            timeout_minutes: 40
          - mode: normal
            shard: products
            make_targets: "go-test-products"
            timeout_minutes: 55
          - mode: race
            shard: core
            make_targets: "go-race-core"
            timeout_minutes: 40
          - mode: race
            shard: products
            make_targets: "go-race-products"
            timeout_minutes: 55
          - mode: cgo0
            shard: core
            make_targets: "cgo-zero-build-core"
            timeout_minutes: 30
          - mode: cgo0
            shard: products
            make_targets: "cgo-zero-build-products"
            timeout_minutes: 50

          - mode: normal
            shard: integration
            make_targets: "go-test-integration"
            timeout_minutes: 40
          - mode: normal
            shard: conformance
            make_targets: "go-test-conformance"
            timeout_minutes: 40
          - mode: race
            shard: integration
            make_targets: "go-race-integration"
            timeout_minutes: 40
          - mode: race
            shard: conformance
            make_targets: "go-race-conformance"
            timeout_minutes: 40
          - mode: cgo0
            shard: integration
            make_targets: "cgo-zero-build-integration"
            timeout_minutes: 40
          - mode: cgo0
            shard: conformance
            make_targets: "cgo-zero-build-conformance"
            timeout_minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Assert runner coordinate
        run: |
          go version
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "amd64"

      - name: Run portable Go mode
        run: make ${{ matrix.make_targets }}

      - name: Require a clean worktree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  exact-darwin-validation:
    needs: validation-plan
    if: needs.validation-plan.result == 'success' && contains(fromJSON(needs.validation-plan.outputs.jobs || '[]'), 'exact-darwin-validation')
    name: Validate exact darwin/arm64 profile and SQLite lifecycle
    runs-on: macos-15
    timeout-minutes: 15
    env:
      LC_ALL: C
      PYTHONHASHSEED: "0"
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.12"
          python-version: "3.14.3"
          enable-cache: true

      - name: Install locked Python dependencies
        run: |
          uv sync --frozen
          uv sync --project conformance/reference/drf --frozen

      - name: Print exact runner fingerprint
        run: |
          uv run --frozen python -c 'import django, platform, sqlite3, sys; print(sys.version); print(django.get_version()); print(sqlite3.sqlite_version); print(platform.platform())'
          go version
          go env GOOS GOARCH

      - name: Run focused pure-Go lifecycle validation
        if: ${{ !contains(fromJSON(needs.validation-plan.outputs.jobs), 'relation-product-matrix') || !contains(fromJSON(needs.validation-plan.outputs.jobs), 'product-project-check-matrix') }}
        env:
          CGO_ENABLED: "0"
        run: >
          go test -count=1
          ./migrations
          ./db/sqlite
          ./conformance/runners/godj
          ./internal/compiletest

      - name: Verify exact Python profile and locked oracles
        run: make python-test-exact oracle-check

      - name: Ensure reference artifacts were not rewritten
        run: >
          git diff --exit-code --
          conformance/contracts
          conformance/fixtures/godj-query-breadth-not-implemented.json
          conformance/fixtures/godj-query-expression-not-implemented.json
          conformance/fixtures/godj-migration-command-not-implemented.json
          conformance/fixtures/godj-migration-writer-not-implemented.json
          conformance/fixtures/godj-migration-status-not-implemented.json
          conformance/fixtures/godj-migration-target-plan-not-implemented.json
          conformance/fixtures/godj-migration-sql-rendering-not-implemented.json
          conformance/fixtures/godj-migration-target-plan-deviation-expected.json
          conformance/fixtures/godj-migration-writer-deviation-expected.json
          conformance/fixtures/godj-parameter-routing-not-implemented.json
          conformance/fixtures/godj-article-api-not-implemented.json
          conformance/fixtures/godj-api-authentication-not-implemented.json
          conformance/fixtures/godj-api-authentication-deviation-expected.json
          conformance/fixtures/godj-system-state-not-implemented.json
          conformance/fixtures/godj-system-state-deviation-expected.json
          conformance/profiles
          conformance/oracles
          conformance/reference/drf

  relation-product-matrix:
    needs: validation-plan
    if: needs.validation-plan.result == 'success' && contains(fromJSON(needs.validation-plan.outputs.jobs || '[]'), 'relation-product-matrix')
    name: Relation product (${{ matrix.platform.runs_on }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: ${{ matrix.platform.timeout_minutes[matrix.mode] }}
    env:
      LC_ALL: C
      TZ: UTC
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runs_on: "ubuntu-22.04"
            expected_goos: "linux"
            expected_goarch: "amd64"
            timeout_minutes: {normal: 20, race: 20, cgo0: 20}
          - runs_on: "ubuntu-24.04-arm"
            expected_goos: "linux"
            expected_goarch: "arm64"
            timeout_minutes: {normal: 20, race: 20, cgo0: 20}
          - runs_on: "macos-15-intel"
            expected_goos: "darwin"
            expected_goarch: "amd64"
            timeout_minutes: {normal: 20, race: 30, cgo0: 20}
          - runs_on: "macos-26"
            expected_goos: "darwin"
            expected_goarch: "arm64"
            timeout_minutes: {normal: 20, race: 20, cgo0: 20}
        mode: [normal, race, cgo0]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Assert runner coordinate
        run: |
          go version
          go env GOOS GOARCH
          test "$(go env GOOS)" = "${{ matrix.platform.expected_goos }}"
          test "$(go env GOARCH)" = "${{ matrix.platform.expected_goarch }}"

      - name: Run relation product mode
        env:
          RUNNER_COVERED: ${{ contains(fromJSON(needs.validation-plan.outputs.jobs), 'product-project-check-matrix') }}
        run: |
          set -euo pipefail
          mode="${{ matrix.mode }}"
          relation_godj_runner='^(TestRelationProductGeneratesTwelveObservedContractsMatchingLockedOracle|TestRelationMetadataObservationChangesForEveryOwnedEdgeMutation|TestRelationAdapterDoesNotImportDBOrReferenceArtifacts|TestMigrationRelationDiagnosticCharacterizationRemainsLockedUnregisteredDeterministicAndDoesNotCompareOracle|TestMigrationRelationCharacterizationRejectsStatusPhaseAndDimensionDrift|TestMigrationRelationCharacterizationUsesScenarioNotContractIdentity|TestMigrationRelationCharacterizationSourceHasNoExpectedArtifactShortcut)$'
          relation_godjcheck='^(TestRunMatchesTwelveContractRelationProductBeforePublishingActualOutput|TestRunLeavesMigrationRelationReferenceNotImplementedWithoutProductHandlers|TestRunRejectsMigrationRelationFalseGreenBeforePublishingActualOutput|TestRunDoesNotPublishRelationActualBeforePayloadComparison|TestRunRejectsRelationRegistryStatusFalseGreensBeforeActualOutput|TestRunRejectsUnknownRelationStatusBeforeActualOutput)$'
          test_flags=(-timeout=20m -json -count=1)
          case "$mode" in
            normal) ;;
            race) test_flags+=(-race) ;;
            cgo0) export CGO_ENABLED=0 ;;
            *) exit 1 ;;
          esac
          packages=(
            ./query ./codegen/consumertest ./orm ./db/sqlite ./migrations ./migrations/definition
            ./conformance/relationfixture/...
            ./conformance/relationproduct/... ./conformance/relationqueryproduct/...
            ./conformance/relationobjectproduct/... ./conformance/relationreverseproduct/...
            ./conformance/relationprefetchproduct/... ./conformance/relationselectproduct/...
            ./conformance/relationdeleteproduct/... ./conformance/migrationrelationproduct
            ./conformance/internal/protocol ./internal/compiletest
          )
          # Pure schema/codegen logic belongs to Portable Go. The generated
          # consumers and actual relation products still run on every platform.
          expected=("${packages[@]}" ./conformance/cmd/godjcheck)
          if [ "$RUNNER_COVERED" != true ]; then
            expected+=(./conformance/runners/godj)
          fi
          expected_packages="$RUNNER_TEMP/relation-packages.txt"
          go list "${expected[@]}" > "$expected_packages"
          required="$RUNNER_TEMP/relation-required.txt"
          awk -F'|' -v covered="$RUNNER_COVERED" 'covered != "true" || $1 != "github.com/progresshans/godj/conformance/runners/godj"' scripts/ci/relation-required.txt > "$required"
          log="$RUNNER_TEMP/relation-product-tests.json"
          stderr_log="$RUNNER_TEMP/relation-product.stderr"
          status=0
          go test "${test_flags[@]}" "${packages[@]}" > "$log" 2> "$stderr_log" || status=$?
          if [ "$status" -eq 0 ] && [ "$RUNNER_COVERED" != true ]; then
            go test "${test_flags[@]}" -p=1 -run "$relation_godj_runner" ./conformance/runners/godj >> "$log" 2>> "$stderr_log" || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            go test "${test_flags[@]}" -p=1 -run "$relation_godjcheck" ./conformance/cmd/godjcheck >> "$log" 2>> "$stderr_log" || status=$?
          fi
          if [ "$status" -ne 0 ]; then
            python3 scripts/ci/go_test_events.py "$log" --diagnostics --stderr "$stderr_log" || true
            exit "$status"
          fi
          python3 scripts/ci/go_test_events.py "$log" --required "$required" --packages "$expected_packages" --no-skips
          if [ "$mode" = normal ]; then
            go vet ./migrations ./db/sqlite
          fi

      - name: Require a clean worktree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  product-project-check-matrix:
    needs: validation-plan
    if: needs.validation-plan.result == 'success' && contains(fromJSON(needs.validation-plan.outputs.jobs || '[]'), 'product-project-check-matrix')
    name: Product project check (${{ matrix.platform.runs_on }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: ${{ matrix.platform.timeout_minutes[matrix.mode] }}
    env:
      LC_ALL: C
      TZ: UTC
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runs_on: "ubuntu-22.04"
            expected_goos: "linux"
            expected_goarch: "amd64"
            cmd_test_timeout: "20m"
            timeout_minutes: {normal: 45, race: 55, cgo0: 45}
          - runs_on: "ubuntu-24.04-arm"
            expected_goos: "linux"
            expected_goarch: "arm64"
            cmd_test_timeout: "20m"
            timeout_minutes: {normal: 40, race: 50, cgo0: 40}
          - runs_on: "macos-15-intel"
            expected_goos: "darwin"
            expected_goarch: "amd64"
            cmd_test_timeout: "30m"
            timeout_minutes: {normal: 55, race: 65, cgo0: 55}
          - runs_on: "macos-26"
            expected_goos: "darwin"
            expected_goarch: "arm64"
            cmd_test_timeout: "20m"
            timeout_minutes: {normal: 45, race: 55, cgo0: 45}
        mode: [normal, race, cgo0]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true

      - name: Assert runner coordinate
        run: |
          go version
          go env GOOS GOARCH
          test "$(go env GOOS)" = "${{ matrix.platform.expected_goos }}"
          test "$(go env GOARCH)" = "${{ matrix.platform.expected_goarch }}"

      - name: Run and inventory product project-check mode
        run: |
          set -euo pipefail
          mode="${{ matrix.mode }}"
          cmd_test_flags=(-timeout="${{ matrix.platform.cmd_test_timeout }}" -count=1)
          test_flags=(-timeout=20m -count=1)
          json_flags=(-timeout=15m -json -count=1)
          case "$mode" in
            normal)
              ;;
            race)
              cmd_test_flags+=(-race)
              test_flags+=(-race)
              json_flags+=(-race)
              ;;
            cgo0)
              export CGO_ENABLED=0
              ;;
            *)
              echo "unsupported product project-check mode: $mode" >&2
              exit 1
              ;;
          esac

          # These package groups are intentionally separate. cmd/godj owns many
          # sequential process tests and therefore gets a coordinate-specific
          # cumulative package budget; project/internal and the conformance
          # runner retain their independent 20-minute package budgets. The
          # operator product has its own OS/mode matrix below.
          go test "${cmd_test_flags[@]}" ./cmd/godj
          # Pure wire packages run in Portable Go; this owner exercises the
          # real selection, linked runner and OS/process boundaries.
          platform_packages="$(go list ./project ./internal/projectcheck/... | python3 scripts/ci/packages.py platform)"
          go test "${test_flags[@]}" $platform_packages
          # This complete runner execution also owns relation sentinels when
          # both matrices are selected. Missing/skipped execution must fail.
          runner_log="$RUNNER_TEMP/conformance-runner-${mode}.json"
          runner_stderr="$RUNNER_TEMP/conformance-runner.stderr"
          status=0
          go test "${test_flags[@]}" -json ./conformance/runners/godj > "$runner_log" 2> "$runner_stderr" || status=$?
          if [ "$status" -ne 0 ]; then
            python3 scripts/ci/go_test_events.py "$runner_log" --diagnostics --stderr "$runner_stderr" || true
            exit "$status"
          fi
          runner_required="$RUNNER_TEMP/conformance-runner-required.txt"
          awk -F'|' '$1 == "github.com/progresshans/godj/conformance/runners/godj"' scripts/ci/relation-required.txt > "$runner_required"
          python3 scripts/ci/go_test_events.py "$runner_log" --required "$runner_required" --no-skips

          runserver_log="$RUNNER_TEMP/runserver-product-${mode}.json"
          stderr_log="$RUNNER_TEMP/product.stderr"
          status=0
          go test "${json_flags[@]}" ./conformance/runserverproduct > "$runserver_log" 2> "$stderr_log" || status=$?
          if [ "$status" -ne 0 ]; then
            python3 scripts/ci/go_test_events.py "$runserver_log" --diagnostics --stderr "$stderr_log" || true
            exit "$status"
          fi
          runserver_package="github.com/progresshans/godj/conformance/runserverproduct"
          runserver_required=(
            "TestGlobalRunserverArticleSQLiteDevelopmentLoop"
            "TestGlobalRunserverPublishesAuthenticatedArticleAdminAndAPI"
            "TestGlobalRunserverRejectsStaleCopiedArticleBeforeRuntime"
            "TestRunserverHarnessForcedCleanupIncludesSeparateDescendantGroup"
          )
          required="$RUNNER_TEMP/runserver-required.txt"
          for test_name in "${runserver_required[@]}"; do
            printf '%s|%s\n' "$runserver_package" "$test_name"
          done > "$required"
          python3 scripts/ci/go_test_events.py "$runserver_log" --required "$required"

          if [ "$mode" = "normal" ]; then
            go vet ./cmd/godj $platform_packages
            go vet ./conformance/runserverproduct
          fi

      - name: Cold external CLI build milestone
        if: needs.validation-plan.outputs.suite == 'full' && matrix.mode == 'normal' && matrix.platform.expected_goos == 'linux' && matrix.platform.expected_goarch == 'amd64'
        env:
          GODJ_COLD_BUILD: "1"
        run: |
          log="$RUNNER_TEMP/cold-cli.json"
          stderr_log="$RUNNER_TEMP/cold-cli.stderr"
          status=0
          go test -json -count=1 -timeout=5m -run '^TestActualGodjMigrationCheckProcess$/^implicit_success$' ./cmd/godj > "$log" 2> "$stderr_log" || status=$?
          if [ "$status" -ne 0 ]; then
            python3 scripts/ci/go_test_events.py "$log" --diagnostics --stderr "$stderr_log" || true
            exit "$status"
          fi
          required="$RUNNER_TEMP/cold-cli-required.txt"
          printf '%s\n' 'github.com/progresshans/godj/cmd/godj|TestActualGodjMigrationCheckProcess/implicit_success' > "$required"
          python3 scripts/ci/go_test_events.py "$log" --required "$required" --no-skips

      - name: Require a clean worktree
        run: |
          git diff --exit-code
