name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance-validation:
    name: Validate checked-in conformance artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LC_ALL: C
      PYTHONHASHSEED: "0"
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.14.3"
          enable-cache: false

      - name: Install locked Python dependencies
        run: uv sync --frozen

      - name: Print non-authoritative CI fingerprint
        run: |
          uv run --frozen python -c 'import django, platform, sqlite3, sys; print(sys.version); print(django.get_version()); print(sqlite3.sqlite_version); print(platform.platform())'
          go version

      - name: Run portable conformance validation
        run: make ci

      - name: Validate project-linked migration check contracts
        run: go test -count=1 ./conformance/projectcheck

      - name: Compile migration definition and project-check products on 32-bit Linux
        env:
          CGO_ENABLED: "0"
          GOARCH: "386"
        run: >
          go test -run '^$' -count=1
          ./migrations/definition
          ./cmd/godj
          ./project
          ./internal/projectcheck/...
          ./conformance/runners/godj

      - name: Run relation products on 32-bit Linux
        env:
          CGO_ENABLED: "0"
          GOARCH: "386"
        run: >
          go test -count=1
          ./query
          ./orm
          ./conformance/relationproduct/...
          ./conformance/relationqueryproduct/...
          ./conformance/relationobjectproduct/...
          ./conformance/relationreverseproduct/...
          ./conformance/relationprefetchproduct/...
          ./conformance/relationselectproduct/...
          ./conformance/relationdeleteproduct/...
          ./conformance/runners/godj

      - name: Verify stored oracle checksum
        working-directory: conformance/oracles/django-6.1-sqlite-darwin-arm64
        run: sha256sum --check SHA256SUMS

      - name: Ensure reference artifacts were not rewritten
        run: git diff --exit-code -- conformance/contracts conformance/profiles conformance/oracles

  exact-darwin-validation:
    name: Validate exact darwin/arm64 profile and SQLite lifecycle
    runs-on: macos-15
    timeout-minutes: 15
    env:
      LC_ALL: C
      PYTHONHASHSEED: "0"
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.12"
          python-version: "3.14.3"
          enable-cache: false

      - name: Install locked Python dependencies
        run: uv sync --frozen

      - name: Print exact runner fingerprint
        run: |
          uv run --frozen python -c 'import django, platform, sqlite3, sys; print(sys.version); print(django.get_version()); print(sqlite3.sqlite_version); print(platform.platform())'
          go version
          go env GOOS GOARCH

      - name: Run focused pure-Go lifecycle validation
        env:
          CGO_ENABLED: "0"
        run: >
          go test -count=1
          ./migrations
          ./db/sqlite
          ./conformance/runners/godj
          ./internal/compiletest

      - name: Validate project-linked migration check contracts
        run: go test -count=1 ./conformance/projectcheck

      - name: Verify exact Python profile and locked oracles
        run: make python-test-exact oracle-check

      - name: Ensure reference artifacts were not rewritten
        run: git diff --exit-code -- conformance/contracts conformance/profiles conformance/oracles

  project-check-matrix:
    name: Project check (${{ matrix.runs_on }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    env:
      LC_ALL: C
      TZ: UTC
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-22.04
            expected_goos: linux
            expected_goarch: amd64
          - runs_on: ubuntu-24.04-arm
            expected_goos: linux
            expected_goarch: arm64
          - runs_on: macos-15-intel
            expected_goos: darwin
            expected_goarch: amd64
          - runs_on: macos-26
            expected_goos: darwin
            expected_goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: false

      - name: Assert runner coordinate
        run: |
          go version
          go env GOOS GOARCH
          test "$(go env GOOS)" = "${{ matrix.expected_goos }}"
          test "$(go env GOARCH)" = "${{ matrix.expected_goarch }}"

      - name: Run normal project-check tests
        run: go test -count=1 ./conformance/projectcheck

      - name: Run project-check race tests
        run: go test -race -count=1 ./conformance/projectcheck

      - name: Run project-check without CGO
        run: CGO_ENABLED=0 go test -count=1 ./conformance/projectcheck

      - name: Vet project-check
        run: go vet ./conformance/projectcheck

      - name: Require a clean worktree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  relation-binding-matrix:
    name: Relation binding (${{ matrix.runs_on }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    env:
      LC_ALL: C
      TZ: UTC
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-22.04
            expected_goos: linux
            expected_goarch: amd64
          - runs_on: ubuntu-24.04-arm
            expected_goos: linux
            expected_goarch: arm64
          - runs_on: macos-15-intel
            expected_goos: darwin
            expected_goarch: amd64
          - runs_on: macos-26
            expected_goos: darwin
            expected_goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: false

      - name: Assert runner coordinate
        run: |
          go version
          go env GOOS GOARCH
          test "$(go env GOOS)" = "${{ matrix.expected_goos }}"
          test "$(go env GOARCH)" = "${{ matrix.expected_goarch }}"

      - name: Run normal relation-binding and external compile proofs
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/relation-binding-tests.json"
          go test -json -count=1 ./conformance/relationbinding | tee "$log"
          python3 - "$log" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              events = [json.loads(line) for line in stream if line.strip()]
          top_level_runs = {
              event["Test"]
              for event in events
              if event.get("Action") == "run"
              and "Test" in event
              and "/" not in event["Test"]
          }
          top_level_passes = {
              event["Test"]
              for event in events
              if event.get("Action") == "pass"
              and "Test" in event
              and "/" not in event["Test"]
          }
          skipped = [
              event["Test"]
              for event in events
              if event.get("Action") == "skip" and "Test" in event
          ]
          assert len(top_level_runs) == 18, sorted(top_level_runs)
          assert top_level_passes == top_level_runs, (
              sorted(top_level_runs),
              sorted(top_level_passes),
          )
          assert skipped == [], skipped
          PY

      - name: Run relation-binding race tests
        run: go test -race -count=1 ./conformance/relationbinding

      - name: Run relation-binding tests without CGO
        run: CGO_ENABLED=0 go test -count=1 ./conformance/relationbinding

      - name: Vet relation-binding proof
        run: go vet ./conformance/relationbinding

      - name: Ensure relation artifacts were not rewritten
        run: >
          git diff --quiet --
          conformance/contracts/relation-manifest.json
          conformance/fixtures/godj-relation-not-implemented.json
          conformance/oracles/django-6.1-sqlite-darwin-arm64/relation-oracle.json

      - name: Require a clean worktree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  relation-product-matrix:
    name: Relation product (${{ matrix.runs_on }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    env:
      LC_ALL: C
      TZ: UTC
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-22.04
            expected_goos: linux
            expected_goarch: amd64
          - runs_on: ubuntu-24.04-arm
            expected_goos: linux
            expected_goarch: arm64
          - runs_on: macos-15-intel
            expected_goos: darwin
            expected_goarch: amd64
          - runs_on: macos-26
            expected_goos: darwin
            expected_goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: false

      - name: Assert runner coordinate
        run: |
          go version
          go env GOOS GOARCH
          test "$(go env GOOS)" = "${{ matrix.expected_goos }}"
          test "$(go env GOARCH)" = "${{ matrix.expected_goarch }}"

      - name: Run relation product and exact no-skip inventory
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/relation-product-tests.json"
          status=0
          go test -json -count=1 \
            ./schema/... \
            ./query \
            ./codegen \
            ./orm \
            ./db/sqlite \
            ./migrations \
            ./migrations/definition \
            ./conformance/relationproduct/... \
            ./conformance/relationqueryproduct/... \
            ./conformance/relationobjectproduct/... \
            ./conformance/relationreverseproduct/... \
            ./conformance/relationprefetchproduct/... \
            ./conformance/relationselectproduct/... \
            ./conformance/relationdeleteproduct/... \
            ./conformance/internal/protocol \
            ./conformance/runners/godj \
            ./conformance/cmd/godjcheck \
            ./internal/compiletest > "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            formatter_status=0
            diagnostic_log="$RUNNER_TEMP/relation-product-failure.txt"
            python3 - "$log" > "$diagnostic_log" 2>&1 <<'PY' || formatter_status=$?
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              events = [json.loads(line) for line in stream if line.strip()]
          max_failure_diagnostic_bytes = 60000
          failed_events = [event for event in events if event.get("Action") == "fail"]
          failed_tests = {(event.get("Package"), event["Test"]) for event in failed_events if "Test" in event}
          failed_packages = {event.get("Package") for event in failed_events if "Test" not in event}
          failed_test_packages = {package for package, _ in failed_tests}
          package_only_failures = failed_packages - failed_test_packages
          failed_event_diagnostic = "".join(json.dumps(event, sort_keys=True) + "\n" for event in failed_events)
          selected_output = "".join(
              event.get("Output", "")
              for event in events
              if event.get("Action") == "output"
              and (
                  (event.get("Package"), event.get("Test")) in failed_tests
                  or (event.get("Package") in failed_packages and event.get("Test") is None)
                  or event.get("Package") in package_only_failures
              )
          )
          diagnostic = bytearray(failed_event_diagnostic.encode("utf-8", "replace"))
          truncated = len(diagnostic) > max_failure_diagnostic_bytes
          if truncated:
              diagnostic = diagnostic[:max_failure_diagnostic_bytes]
          else:
              encoded_output = selected_output.encode("utf-8", "replace")
              remaining = max_failure_diagnostic_bytes - len(diagnostic)
              if len(encoded_output) > remaining:
                  truncated = True
                  if remaining > 0:
                      diagnostic.extend(encoded_output[-remaining:])
              else:
                  diagnostic.extend(encoded_output)
          sys.stdout.write(diagnostic.decode("utf-8", "replace"))
          if diagnostic and not diagnostic.endswith(b"\n"):
              print()
          if truncated:
              print(f"relation-product failure diagnostics truncated at {max_failure_diagnostic_bytes} bytes")
          PY
            if [ "$formatter_status" -ne 0 ]; then
              fallback_log="$RUNNER_TEMP/relation-product-failure-fallback.txt"
              tail -c 60000 "$log" > "$fallback_log"
              echo "relation-product failure formatter exited $formatter_status; preserving go test status $status" >> "$fallback_log"
              diagnostic_log="$fallback_log"
            fi
            tail -c 65536 "$diagnostic_log"
            exit "$status"
          fi
          python3 - "$log" <<'PY'
          import hashlib
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              events = [json.loads(line) for line in stream if line.strip()]
          runs = {
              (event.get("Package"), event["Test"])
              for event in events
              if event.get("Action") == "run"
              and "Test" in event
              and "/" not in event["Test"]
          }
          passes = {
              (event.get("Package"), event["Test"])
              for event in events
              if event.get("Action") == "pass"
              and "Test" in event
              and "/" not in event["Test"]
          }
          skipped = [
              (event.get("Package"), event["Test"])
              for event in events
              if event.get("Action") == "skip" and "Test" in event
          ]
          payload = b"".join(
              package.encode("utf-8")
              + b"\0"
              + test.encode("utf-8")
              + b"\n"
              for package, test in sorted(runs)
          )
          assert len(runs) == 837, sorted(runs)
          assert len(payload) == 85756, len(payload)
          payload_sha256 = hashlib.sha256(payload).hexdigest()
          assert payload_sha256 == "c30c14ac691bb942d9f694d293b1917152231e0ba534b5d89010ce10707eb910"
          assert passes == runs, (sorted(runs), sorted(passes))
          assert skipped == [], skipped
          for package, test in sorted(list(runs)):
              print(json.dumps({"relation_product_run": [package, test]}, separators=(",", ":")))
          print(json.dumps({
              "relation_product_inventory": {
                  "runs": len(runs),
                  "passes": len(passes),
                  "skips": len(skipped),
                  "payload_bytes": len(payload),
                  "payload_sha256": payload_sha256,
              }
          }, sort_keys=True))
          PY

      - name: Run relation product race tests
        run: >
          go test -race -count=1
          ./schema/...
          ./query
          ./codegen
          ./orm
          ./db/sqlite
          ./migrations
          ./migrations/definition
          ./conformance/relationproduct/...
          ./conformance/relationqueryproduct/...
          ./conformance/relationobjectproduct/...
          ./conformance/relationreverseproduct/...
          ./conformance/relationprefetchproduct/...
          ./conformance/relationselectproduct/...
          ./conformance/relationdeleteproduct/...
          ./conformance/internal/protocol
          ./conformance/runners/godj
          ./conformance/cmd/godjcheck
          ./internal/compiletest

      - name: Run relation product tests without CGO
        run: >
          CGO_ENABLED=0 go test -count=1
          ./schema/...
          ./query
          ./codegen
          ./orm
          ./db/sqlite
          ./migrations
          ./migrations/definition
          ./conformance/relationproduct/...
          ./conformance/relationqueryproduct/...
          ./conformance/relationobjectproduct/...
          ./conformance/relationreverseproduct/...
          ./conformance/relationprefetchproduct/...
          ./conformance/relationselectproduct/...
          ./conformance/relationdeleteproduct/...
          ./conformance/internal/protocol
          ./conformance/runners/godj
          ./conformance/cmd/godjcheck
          ./internal/compiletest

      - name: Vet relation product packages
        run: >
          go vet
          ./schema/...
          ./query
          ./codegen
          ./orm
          ./db/sqlite
          ./migrations
          ./migrations/definition
          ./conformance/relationproduct/...
          ./conformance/relationqueryproduct/...
          ./conformance/relationobjectproduct/...
          ./conformance/relationreverseproduct/...
          ./conformance/relationprefetchproduct/...
          ./conformance/relationselectproduct/...
          ./conformance/relationdeleteproduct/...
          ./conformance/internal/protocol
          ./conformance/runners/godj
          ./conformance/cmd/godjcheck
          ./internal/compiletest

      - name: Ensure relation artifacts and generated fixtures were not rewritten
        run: >
          git diff --quiet --
          conformance/contracts/relation-manifest.json
          conformance/fixtures/godj-relation-not-implemented.json
          conformance/oracles/django-6.1-sqlite-darwin-arm64/relation-oracle.json
          conformance/relationproduct
          conformance/relationqueryproduct
          conformance/relationobjectproduct
          conformance/relationreverseproduct
          conformance/relationprefetchproduct
          conformance/relationselectproduct
          conformance/relationdeleteproduct

      - name: Require a clean worktree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  product-project-check-matrix:
    name: Product project check (${{ matrix.runs_on }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    env:
      LC_ALL: C
      TZ: UTC
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-22.04
            expected_goos: linux
            expected_goarch: amd64
          - runs_on: ubuntu-24.04-arm
            expected_goos: linux
            expected_goarch: arm64
          - runs_on: macos-15-intel
            expected_goos: darwin
            expected_goarch: amd64
          - runs_on: macos-26
            expected_goos: darwin
            expected_goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: false

      - name: Assert runner coordinate
        run: |
          go version
          go env GOOS GOARCH
          test "$(go env GOOS)" = "${{ matrix.expected_goos }}"
          test "$(go env GOARCH)" = "${{ matrix.expected_goarch }}"

      - name: Run normal product project-check tests
        run: go test -count=1 ./cmd/godj ./project ./internal/projectcheck/... ./conformance/runners/godj

      - name: Run product project-check race tests
        run: go test -race -count=1 ./cmd/godj ./project ./internal/projectcheck/... ./conformance/runners/godj

      - name: Run product project-check tests without CGO
        run: CGO_ENABLED=0 go test -count=1 ./cmd/godj ./project ./internal/projectcheck/... ./conformance/runners/godj

      - name: Vet product project-check packages
        run: go vet ./cmd/godj ./project ./internal/projectcheck/... ./conformance/runners/godj

      - name: Require a clean worktree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  python-compatibility-matrix:
    name: Python compatibility (${{ matrix.python_version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LC_ALL: C
      PYTHONHASHSEED: "0"
      TZ: UTC
      UV_PYTHON_DOWNLOADS: never
    strategy:
      fail-fast: false
      matrix:
        python_version:
          - "3.12.13"
          - "3.13.15"
          - "3.14.3"
          - "3.14.7"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Python
        id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python_version }}
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Assert isolated compatibility runtime
        env:
          COMPAT_PYTHON: ${{ steps.python.outputs.python-path }}
          EXPECTED_PYTHON: ${{ matrix.python_version }}
        run: |
          uv --version | grep -Eq '^uv 0[.]12[.]3([[:space:]]|$)'
          uv run --no-project --isolated --python "$COMPAT_PYTHON" \
            --with Django==6.1 --with asgiref==3.12.1 --with sqlparse==0.5.5 \
            python - <<'PY'
          import platform
          import asgiref
          import django
          import sqlparse

          expected = __import__("os").environ["EXPECTED_PYTHON"]
          assert platform.python_version() == expected, (platform.python_version(), expected)
          assert django.get_version() == "6.1", django.get_version()
          assert asgiref.__version__ == "3.12.1", asgiref.__version__
          assert sqlparse.__version__ == "0.5.5", sqlparse.__version__
          PY

      - name: Run exact portable Python suite
        env:
          COMPAT_PYTHON: ${{ steps.python.outputs.python-path }}
          EXPECTED_PYTHON: ${{ matrix.python_version }}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/python-compatibility-tests.txt"
          uv run --no-project --isolated --python "$COMPAT_PYTHON" \
            --with Django==6.1 --with asgiref==3.12.1 --with sqlparse==0.5.5 \
            python -m unittest discover -s conformance/runners/django/tests -v 2>&1 | tee "$log"
          test "$(grep -c '^test_' "$log")" -eq 216
          test "$(grep -c ' \.\.\. skipped ' "$log")" -eq 19
          grep -Fq 'Ran 216 tests' "$log"
          grep -Fq 'OK (skipped=19)' "$log"

      - name: Verify all-scenario semantic digest
        env:
          COMPAT_PYTHON: ${{ steps.python.outputs.python-path }}
          EXPECTED_PYTHON: ${{ matrix.python_version }}
        run: |
          uv run --no-project --isolated --python "$COMPAT_PYTHON" \
            --with Django==6.1 --with asgiref==3.12.1 --with sqlparse==0.5.5 \
            python - <<'PY'
          import hashlib

          from conformance.runners.django.normalizer import canonical_json
          from conformance.runners.django.runner import SCENARIOS

          payload = b"".join(
              name.encode("utf-8")
              + b"\0"
              + canonical_json(SCENARIOS[name](f"PYCOMPAT-{name}"))
              + b"\0"
              for name in sorted(SCENARIOS)
          )
          assert len(SCENARIOS) == 139, len(SCENARIOS)
          assert len(payload) == 623543, len(payload)
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == "f4f48c4c680debbe5ed7ab2b962e01e9110064b7bf3064b7c6fd9a06539018da", digest
          PY

      - name: Require a clean worktree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  sqlite-matrix:
    name: SQLite (${{ matrix.runs_on }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    env:
      LC_ALL: C
      TZ: UTC
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-22.04
            expected_goos: linux
            expected_goarch: amd64
          - runs_on: ubuntu-24.04-arm
            expected_goos: linux
            expected_goarch: arm64
          - runs_on: macos-15-intel
            expected_goos: darwin
            expected_goarch: amd64
          - runs_on: macos-26
            expected_goos: darwin
            expected_goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: false

      - name: Assert runner coordinate
        run: |
          go version
          go env GOOS GOARCH
          test "$(go env GOOS)" = "${{ matrix.expected_goos }}"
          test "$(go env GOARCH)" = "${{ matrix.expected_goarch }}"

      - name: Run normal SQLite tests
        run: go test -count=1 ./migrations ./db/sqlite

      - name: Run SQLite race tests
        run: go test -race -count=1 ./migrations ./db/sqlite

      - name: Run SQLite tests without CGO
        run: CGO_ENABLED=0 go test -count=1 ./migrations ./db/sqlite

      - name: Vet SQLite packages
        run: go vet ./migrations ./db/sqlite

      - name: Run GDJ-0035 Phase B no-product feasibility inventory
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/migration-relation-feasibility-tests.json"
          status=0
          go test -json -count=1 ./conformance/migrationrelation > "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            tail -c 60000 "$log"
            exit "$status"
          fi
          python3 - "$log" <<'PY'
          import hashlib
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              events = [json.loads(line) for line in stream if line.strip()]
          runs = {
              (event.get("Package"), event["Test"])
              for event in events
              if event.get("Action") == "run"
              and "Test" in event
              and "/" not in event["Test"]
          }
          passes = {
              (event.get("Package"), event["Test"])
              for event in events
              if event.get("Action") == "pass"
              and "Test" in event
              and "/" not in event["Test"]
          }
          skipped = [
              (event.get("Package"), event["Test"])
              for event in events
              if event.get("Action") == "skip" and "Test" in event
          ]
          payload = b"".join(
              package.encode("utf-8")
              + b"\0"
              + test.encode("utf-8")
              + b"\n"
              for package, test in sorted(runs)
          )
          assert len(runs) == 75, sorted(runs)
          assert passes == runs, (sorted(runs), sorted(passes))
          assert skipped == [], skipped
          assert len(payload) == 9736, len(payload)
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == "48e7beb1994c099a0f550da54d0abdcd5bc08157b74a9db22ae3dd42d42592ec", digest
          print(json.dumps({
              "migration_relation_feasibility_inventory": {
                  "runs": len(runs),
                  "passes": len(passes),
                  "skips": len(skipped),
                  "payload_bytes": len(payload),
                  "payload_sha256": digest,
              }
          }, sort_keys=True))
          PY

      - name: Run GDJ-0035 Phase B no-product feasibility race tests
        run: go test -race -count=1 ./conformance/migrationrelation

      - name: Run GDJ-0035 Phase B no-product feasibility without CGO
        run: CGO_ENABLED=0 go test -count=1 ./conformance/migrationrelation

      - name: Vet GDJ-0035 Phase B no-product feasibility
        run: go vet ./conformance/migrationrelation

      - name: Require a clean worktree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
