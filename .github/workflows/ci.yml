  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - conformance-validation
      - portable-go-matrix
      - exact-darwin-validation
      - project-check-matrix
      - relation-binding-matrix
      - relation-product-matrix
      - product-project-check-matrix
      - python-compatibility-matrix
      - postgresql-product
      - sqlite-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every CI lane
        env:
          REQUIRED_RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          expected = {
              "conformance-validation",
              "portable-go-matrix",
              "exact-darwin-validation",
              "project-check-matrix",
              "relation-binding-matrix",
              "relation-product-matrix",
              "product-project-check-matrix",
              "python-compatibility-matrix",
              "postgresql-product",
              "sqlite-matrix",
          }
          results = json.loads(os.environ["REQUIRED_RESULTS_JSON"])
          assert set(results) == expected, (sorted(results), sorted(expected))
          failures = {name: result.get("result") for name, result in results.items() if result.get("result") != "success"}
          if failures:
              raise SystemExit("required CI lanes did not succeed: " + json.dumps(failures, sort_keys=True))
          print(json.dumps({"required_ci": {name: results[name]["result"] for name in sorted(results)}}, sort_keys=True))
          PY
