  python-compatibility-matrix:
    needs: validation-plan
    if: needs.validation-plan.result == 'success' && contains(fromJSON(needs.validation-plan.outputs.jobs || '[]'), 'python-compatibility-matrix')
    name: Python compatibility (${{ matrix.python_version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LC_ALL: C
      PYTHONHASHSEED: "0"
      TZ: UTC
      UV_PYTHON_DOWNLOADS: never
    strategy:
      fail-fast: false
      matrix:
        python_version:
          - "3.12.13"
          - "3.13.15"
          - "3.14.3"
          - "3.14.7"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Assert isolated compatibility runtime
        env:
          COMPAT_PYTHON: ${{ steps.python.outputs.python-path }}
          EXPECTED_PYTHON: ${{ matrix.python_version }}
        run: |
          uv --version | grep -Eq '^uv 0[.]12[.]3([[:space:]]|$)'
          uv run --no-project --isolated --python "$COMPAT_PYTHON" \
            --with Django==6.1 --with djangorestframework==3.18.0 --with asgiref==3.12.1 --with sqlparse==0.5.5 \
            python - <<'PY'
          import platform
          import asgiref
          import django
          import rest_framework
          import sqlparse

          expected = __import__("os").environ["EXPECTED_PYTHON"]
          assert platform.python_version() == expected, (platform.python_version(), expected)
          assert django.get_version() == "6.1", django.get_version()
          assert rest_framework.VERSION == "3.18.0", rest_framework.VERSION
          assert asgiref.__version__ == "3.12.1", asgiref.__version__
          assert sqlparse.__version__ == "0.5.5", sqlparse.__version__
          PY

      - name: Run exact portable Python suite
        env:
          COMPAT_PYTHON: ${{ steps.python.outputs.python-path }}
          EXPECTED_PYTHON: ${{ matrix.python_version }}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/python-compatibility-tests.txt"
          uv run --no-project --isolated --python "$COMPAT_PYTHON" \
            --with Django==6.1 --with djangorestframework==3.18.0 --with asgiref==3.12.1 --with sqlparse==0.5.5 \
            python -m scripts.ci.python_tests 2>&1 | tee "$log"
          grep -Eq '^PYTHON_SUITE_VERIFIED tests=[1-9][0-9]* skips=[0-9]+$' "$log"

      - name: Verify all-scenario semantic digest
        env:
          COMPAT_PYTHON: ${{ steps.python.outputs.python-path }}
          EXPECTED_PYTHON: ${{ matrix.python_version }}
        run: |
          uv run --no-project --isolated --python "$COMPAT_PYTHON" \
            --with Django==6.1 --with djangorestframework==3.18.0 --with asgiref==3.12.1 --with sqlparse==0.5.5 \
            python - <<'PY'
          import hashlib

          from conformance.runners.django.normalizer import canonical_json
          from conformance.runners.django.runner import SCENARIOS

          payload = b"".join(
              name.encode("utf-8")
              + b"\0"
              + canonical_json(SCENARIOS[name](f"PYCOMPAT-{name}"))
              + b"\0"
              for name in sorted(SCENARIOS)
          )
          assert len(SCENARIOS) == 311, len(SCENARIOS)
          assert len(payload) == 1081058, len(payload)
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == "b8d53e874169009fcd4650c79f2a007e18307d2fddd07a07d970f28bce2ed3f5", digest
          PY

      - name: Require a clean worktree
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  postgresql-product:
    needs: validation-plan
