<fieldset data-inline-row="{{ row.index }}" data-inline-row-prefix="{{ row.prefix }}"><legend>Item <span data-inline-number>{{ row.number }}</span></legend>
<input type="hidden" name="{{ row.identity_name }}" value="{{ row.identity }}">
{% if row.has_revision %}<input type="hidden" name="{{ row.prefix }}-expected_revision" value="{{ row.revision }}">{% endif %}
<fieldset data-inline-fields{% if row.readonly %} disabled{% endif %}>{% for field in row.fields %}{% include "field.html" %}{% endfor %}</fieldset>
{% if row.can_order %}<label>Order <input name="{{ row.prefix }}-ORDER" value="{{ row.order }}" inputmode="numeric"></label>{% endif %}
{% if row.can_delete %}<label>Delete <input type="checkbox" name="{{ row.prefix }}-DELETE" value="on"{% if row.deleted %} checked{% endif %}></label>{% endif %}
{% for error in row.errors %}<p data-inline-error="{{ row.prefix }}" data-error-code="{{ error.code }}">{{ error.message }}</p>{% endfor %}
{% if row.can_remove %}<button type="button" data-inline-remove hidden aria-label="Remove item {{ row.number }}">Remove item</button>{% endif %}
</fieldset>
