<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{.ProjectName}} articles</title>
</head>
<body>
  <main>
    <h1>Articles</h1>
    <ul>
      {{range .Articles}}
      <li data-article-id="{{.ID}}" data-published="{{.Published}}">
        <article>
          <h2>{{.Title}}</h2>
          {{with .Summary}}<p class="summary">{{.}}</p>{{else}}<p class="summary summary-null" aria-label="No summary"></p>{{end}}
        </article>
      </li>
      {{else}}
      <li class="empty">No articles.</li>
      {{end}}
    </ul>
    <a href="{{.SelfURL}}">Refresh</a>
  </main>
</body>
</html>
